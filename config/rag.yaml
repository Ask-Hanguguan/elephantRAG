# ============================================================
# 模型提供商配置
# ============================================================
# LLM 和 Embedding 可独立配置不同提供商。
# 提供商: dashscope | ollama | openai
#
# 向后兼容: 以下旧格式配置仍然有效
#   provider / chat_model_name / embedding_model_name / ollama

# ---- LLM 配置 ----
llm:
  provider: dashscope          # dashscope | ollama | openai
  dashscope:
    model_name: qwen-max
  ollama:
    base_url: http://localhost:11434
    model_name: qwen2.5:7b
  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model_name: gpt-4o

# ---- Embedding 配置 ----
embedding:
  provider: dashscope          # dashscope | ollama | openai
  dashscope:
    model_name: text-embedding-v1
  ollama:
    base_url: http://localhost:11434
    model_name: nomic-embed-text
  openai:
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model_name: text-embedding-3-small

# ---- MinerU 文档解析配置 ----
mineru:
  enabled: true
  max_pdf_size_mb: 200
  fallback_to_pypdfium: true
  fallback_to_vl_ocr: true
