collection_name: kb_docs
k: 3
allow_knowledge_file_type: ["txt", "pdf", "csv", "html", "md", "docx", "xlsx", "pptx"]

chunk_size: 200
chunk_overlap: 30
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# BM25稀疏检索配置
bm25:
  k1: 1.5
  b: 0.75
  epsilon: 0.25

# 融合检索配置
fusion:
  rrf_k: 60
  final_top_k: 10
  dense_top_k: 20
  bm25_top_k: 20
