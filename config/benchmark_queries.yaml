# RAG 基准测试查询集
# 知识库：计算机视觉与图像处理、数据挖掘
# expected_sources 为可选字段（填了可计算召回率），用文件名关键词匹配

queries:
  # ============================================================
  # 图像处理（计算机视觉）
  # ============================================================
  - query: "直方图均衡化在图像增强中有什么作用？"
    expected_sources:
      - 灰度变换
    category: "image_processing"

  - query: "高斯滤波和中值滤波在去噪效果上有什么区别？"
    expected_sources:
      - 空间滤波
    category: "image_processing"

  - query: "傅里叶变换在频域滤波中是如何应用的？"
    expected_sources:
      - 频域滤波
    category: "image_processing"

  - query: "显著性检测在计算机视觉中的应用场景是什么？"
    expected_sources:
      - 显著性检测
    category: "image_processing"

  - query: "图像缩放有哪些插值算法？"
    expected_sources:
      - 图像缩放
    category: "image_processing"

  - query: "暗通道先验在图像去雾中的原理是什么？"
    expected_sources:
