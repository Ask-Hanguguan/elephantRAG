# RAG 策略基准测试配置
# 定义要测试的策略组合、Top-K 参数和输出选项

# 要运行的策略列表（可只选部分）
strategies:
  - dense_only
  - bm25_only
  - rrf_fusion
  - fusion_no_segment

# Top-K 结果数量
top_k: 5

# 测试查询集路径
test_queries_path: config/benchmark_queries.yaml

# 报告选项
report:
  # 报告中每个策略显示的结果条数
  show_top_k: 3
  # 内容预览最大字符数
  max_preview_chars: 150
  # 是否保存报告到文件
  save_report: true
  # 是否输出 JSON 格式结果
  save_json: false
