        // DOM元素
        const card = document.getElementById('card');
        const flipBtn = document.getElementById('flip-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const randomizeBtn = document.getElementById('randomize-btn');
        const wordKorean = document.getElementById('word-korean');
        const wordPart = document.getElementById('word-part');
        const wordMeaning = document.getElementById('word-meaning');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const lessonSelector = document.getElementById('lesson-selector');
        
        // 课程信息
        const lessonInfo = {
            25: { name: "打电话", count: 0 },
            26: { name: "服装", count: 0 },
            27: { name: "兴趣", count: 0 },
            28: { name: "问路", count: 0 },
            29: { name: "寒暄", count: 0 },
            30: { name: "在邮局", count: 0 }
        };
        
        // 当前单词索引和过滤后的词汇列表
        let currentIndex = 0;
        let filteredVocabulary = [];
        let currentLesson = 'all';
        let isRandomized = false;
        
        // 初始化：统计每课单词数量
        function countLessonWords() {
            vocabulary.forEach(word => {
                if (lessonInfo[word.lesson]) {
                    lessonInfo[word.lesson].count++;
                }
            });
        }
        
        // 创建课程选择按钮
        function createLessonButtons() {
            // 创建"全部"按钮
            const allBtn = document.createElement('button');
            allBtn.className = 'lesson-btn active';
            allBtn.dataset.lesson = 'all';
            
            const allName = document.createElement('div');
            allName.className = 'lesson-name';
            allName.textContent = '全部课程';
            
            const allCount = document.createElement('div');
            allCount.className = 'lesson-count';
            allCount.textContent = `${vocabulary.length}个单词`;
            
            allBtn.appendChild(allName);
            allBtn.appendChild(allCount);
            lessonSelector.appendChild(allBtn);
            
            // 创建各课按钮
            Object.keys(lessonInfo).forEach(lessonNum => {
                const btn = document.createElement('button');
                btn.className = 'lesson-btn';
                btn.dataset.lesson = lessonNum;
                
                const lessonName = document.createElement('div');
                lessonName.className = 'lesson-name';
                lessonName.textContent = `第${lessonNum}课`;
                
                const lessonCount = document.createElement('div');
                lessonCount.className = 'lesson-count';
                lessonCount.textContent = `${lessonInfo[lessonNum].count}个单词`;
                
                btn.appendChild(lessonName);
                btn.appendChild(lessonCount);
                lessonSelector.appendChild(btn);
                
                // 添加点击事件
                btn.addEventListener('click', () => {
                    filterVocabulary(lessonNum);
                });
            });
            
            // 添加"全部"按钮的点击事件
            allBtn.addEventListener('click', () => {
                filterVocabulary('all');
            });
        }
        
        // 更新进度显示
        function updateProgress() {
            if (filteredVocabulary.length === 0) {
                progressText.textContent = "0 / 0";
                progressFill.style.width = "0%";
                return;
            }
            
            // 更新进度文本
            progressText.textContent = `${currentIndex + 1} / ${filteredVocabulary.length}`;
            
            // 更新进度条
            const progressPercentage = ((currentIndex + 1) / filteredVocabulary.length) * 100;
            progressFill.style.width = `${progressPercentage}%`;
        }
        
        // 初始化显示第一个单词
        function updateCard() {
            if (filteredVocabulary.length === 0) return;
            
            const word = filteredVocabulary[currentIndex];
            wordKorean.textContent = word.korean;
            wordPart.textContent = word.part;
            wordMeaning.textContent = word.meaning;
            
            // 更新卡片上的课程标签
            const lessonLabels = document.querySelectorAll('.word-lesson');
            lessonLabels.forEach(label => {
                label.textContent = `第${word.lesson}课`;
            });
            
            // 更新进度显示
            updateProgress();
            
            // 确保卡片正面朝上
            card.classList.remove('flipped');
            
            // 更新按钮状态
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === filteredVocabulary.length - 1;
        }
        
        // 翻转卡片
        function flipCard() {
            card.classList.toggle('flipped');
        }
        
        // 下一个单词
        function nextWord() {
            if (currentIndex < filteredVocabulary.length - 1) {
                currentIndex++;
                updateCard();
            }
        }
        
        // 上一个单词
        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }
        
        // 随机排序当前词汇表
        function randomizeVocabulary() {
            if (filteredVocabulary.length <= 1) return;
            
            // Fisher-Yates 洗牌算法
            for (let i = filteredVocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredVocabulary[i], filteredVocabulary[j]] = [filteredVocabulary[j], filteredVocabulary[i]];
            }
            
            isRandomized = true;
            currentIndex = 0;
            updateCard();
            
            // 显示提示
            alert(`已对${currentLesson === 'all' ? '全部' : '当前'}单词进行随机排序！`);
        }
        
        // 过滤词汇根据课程
        function filterVocabulary(lesson) {
            currentLesson = lesson;
            isRandomized = false;
            
            if (lesson === 'all') {
                filteredVocabulary = [...vocabulary];
            } else {
                filteredVocabulary = vocabulary.filter(word => word.lesson === parseInt(lesson));
            }
            
            // 重置索引
            currentIndex = 0;
            updateCard();
            
            // 更新课程按钮状态
            document.querySelectorAll('.lesson-btn').forEach(btn => {
                if (btn.dataset.lesson === lesson) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 事件监听
        card.addEventListener('click', flipCard);
        flipBtn.addEventListener('click', flipCard);
        nextBtn.addEventListener('click', nextWord);
        prevBtn.addEventListener('click', prevWord);
        randomizeBtn.addEventListener('click', randomizeVocabulary);
        
        // 初始化
        countLessonWords();
        createLessonButtons();
        filterVocabulary('all');
        
        // 添加键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                case 'Enter':
                    flipCard();
                    break;
                case 'ArrowRight':
                    nextWord();
                    break;
                case 'ArrowLeft':
                    prevWord();
                    break;
                case 'r':
                case 'R':
                    randomizeVocabulary();
                    break;
            }
        });
